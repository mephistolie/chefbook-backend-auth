# Explicit one-time bootstrap of an EMPTY database; never enabled on upgrades.
initialization:
  enabled: false

nameOverride: ""
fullnameOverride: ""

image:
  container: chefbook-backend-auth-service
  registry: ""
  pullPolicy: IfNotPresent
  tag: ""
imagePullSecrets: []

config:
  develop: false
  # Leave empty for stdout only
  logsPath: ""

  auth:
    saltCost: 10
    accessTokenTtl: 20m
    refreshTokenTtl: 720h
    resetPasswordCodeTtl: 24h

  passkeys:
    rpId: ""
    origins: []
    opaqueOrigins: []

  mail:
    passwordResetUrl: ""
    emailChangeUrl: ""

  oauth:
    redirects: []
    googleClientId: ""
    vkClientId: ""

  profileDelete:
    offset: 336h
    checkInterval: 30m

  postgres:
    sslmode: require
    host: ""
    port: 5432
    dbName: chefbook-auth

  rabbitmq:
    name: ""
    namespace: ""
    port: 5672
    vhost: ""

secrets:
  accessToken:
    name: access-token-secrets
    signingKeyRef: signingKey
  auth:
    name: auth-secrets
    hmacKeyRef: hmacKey
    encryptionKeyRef: encryptionKey
  oauth:
    name: oauth-secrets
    googleClientSecretRef: googleClientSecret
    vkClientSecretRef: vkClientSecret
  postgres:
    name: postgres-secrets
    userRef: user
    passwordRef: password
  rabbitmq:
    name: rabbitmq-secrets
    userRef: user
    passwordRef: password


service:
  type: ClusterIP
  port: 8080

replicaCount: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  # targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
